// Contrats gRPC des nœuds de stockage : service Node (client → nœud)
// et service Renewal (nœud → nœud, renouvellement des parts).
syntax = "proto3";

package safevault;

option go_package = "safevault/proto;pb";

// Preuve d'identité jointe à chaque requête adressée à un nœud.
// La signature Ed25519 porte sur : étiquette || 0x00 || "x|file_id|epoch|timestamp|nonce_hex".
message Proof {
  bytes public_key = 1;
  int64 timestamp = 2; // secondes Unix
  bytes nonce = 3;
  bytes signature = 4;
}

// Part de la clé d'un fichier, détenue par le nœud d'abscisse x.
message Share {
  uint32 x = 1;
  bytes value = 2;
  uint64 epoch = 3;
}

// Bloc chiffré d'une version d'un fichier.
message Block {
  string file_id = 1;
  uint32 index = 2;
  bytes data = 3;
  Proof proof = 4;
  uint32 version = 5;  // version du fichier (1 au premier dépôt)
  Grant grant = 6;     // autorisation d'écriture (w), absente pour le propriétaire
}

message PutShareRequest {
  string file_id = 1;
  Share share = 2;
  Proof proof = 3;
  uint32 version = 4;  // version du fichier (1 au premier dépôt)
  Grant grant = 5;     // autorisation d'écriture (w), absente pour le propriétaire
}

message PutShareResponse {}

// Autorisation sur un fichier, signée par son émetteur (Ed25519) : le propriétaire, ou
// un utilisateur qui a reçu le droit de partager (s) ou de gérer (m) et qui joint alors
// sa propre autorisation (parent). Les nœuds vérifient toute la chaîne jusqu'à la clé du
// propriétaire enregistrée au dépôt. Données signées : voir internal/access.
message Grant {
  string file_id = 1;
  bytes issuer_public_key = 2;
  bytes grantee_public_key = 3;
  int64 issued_at = 4;   // secondes Unix
  int64 expires_at = 5;  // secondes Unix, 0 = sans limite
  uint32 rights = 6;     // r = 1, w = 2, s = 4, d = 8, m = 16
  bytes signature = 7;
  Grant parent = 8;      // autorisation de l'émetteur s'il n'est pas propriétaire
}

// Retrait d'un accès, signé par le propriétaire ou par un utilisateur qui a le droit de
// gérer les accès (authority) : les autorisations émises avant revoked_at pour cette clé,
// et celles qui en découlent, ne sont plus acceptées.
message Revocation {
  string file_id = 1;
  bytes issuer_public_key = 2;
  bytes grantee_public_key = 3;
  int64 revoked_at = 4;  // secondes Unix
  bytes signature = 5;
  Grant authority = 6;   // autorisation de l'émetteur (droit m) s'il n'est pas propriétaire
}

// Transfert de la propriété d'un fichier, signé par le propriétaire actuel. Les
// autorisations qu'il a émises avant le transfert restent valables.
message Transfer {
  string file_id = 1;
  bytes owner_public_key = 2;
  bytes new_owner_public_key = 3;
  int64 transferred_at = 4;  // secondes Unix
  bytes signature = 5;
}

message GetShareRequest {
  string file_id = 1;
  uint64 epoch = 2;    // époque attendue par le client
  Proof proof = 3;
  Grant grant = 4;     // autorisation de lecture (r), absente pour le propriétaire
  uint32 version = 5;
}

message GetShareResponse {
  Share share = 1;
}

message PutBlocksResponse {
  uint32 stored = 1; // nombre de blocs stockés
}

message GetBlocksRequest {
  string file_id = 1;
  Proof proof = 2;
  Grant grant = 3;     // autorisation de lecture (r), absente pour le propriétaire
  uint32 version = 4;
}

message RevokeRequest {
  Revocation revocation = 1;
}

message RevokeResponse {}

message DeleteFileRequest {
  string file_id = 1;
  Proof proof = 2;
  Grant grant = 3;     // autorisation de suppression (d), absente pour le propriétaire
}

message DeleteFileResponse {}

message TransferRequest {
  Transfer transfer = 1;
}

message TransferResponse {}

service Node {
  // Dépose la part de la clé d'une version du fichier sur le nœud. La version 1 fait du
  // déposant le propriétaire ; une version suivante exige le droit d'écriture.
  rpc PutShare(PutShareRequest) returns (PutShareResponse);
  // Renvoie la part du nœud ; FAILED_PRECONDITION si l'époque ne correspond pas.
  rpc GetShare(GetShareRequest) returns (GetShareResponse);
  // Reçoit les blocs chiffrés d'une version en flux.
  rpc PutBlocks(stream Block) returns (PutBlocksResponse);
  // Renvoie les blocs chiffrés d'une version en flux.
  rpc GetBlocks(GetBlocksRequest) returns (stream Block);
  // Enregistre un retrait d'accès signé.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Efface toutes les versions du fichier (parts et blocs).
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // Change le propriétaire du fichier.
  rpc TransferOwnership(TransferRequest) returns (TransferResponse);
}

// Sous-part d'un fichier envoyée pendant un renouvellement.
message SubShare {
  string file_id = 1;
  bytes value = 2;
}

message DeliverSubSharesRequest {
  uint32 from_x = 1;       // abscisse du nœud émetteur
  uint32 to_x = 2;         // abscisse du nœud destinataire
  uint64 target_epoch = 3; // époque visée par le renouvellement
  repeated SubShare sub_shares = 4;
}

message DeliverSubSharesResponse {}

service Renewal {
  // Reçoit les sous-parts d'un autre nœud pour l'époque cible.
  // Réservé aux nœuds : l'appelant présente le certificat "node-<from_x>".
  rpc DeliverSubShares(DeliverSubSharesRequest) returns (DeliverSubSharesResponse);
}

// Nœud participant à un renouvellement.
message Participant {
  uint32 x = 1;
  string address = 2; // "hôte:port"
}

message PrepareRequest {
  uint64 epoch = 1;                       // époque cible
  uint32 t = 2;                           // seuil
  repeated Participant participants = 3;  // ensemble fixé par le coordinateur, le même pour tous
}

message EpochRequest {
  uint64 epoch = 1;
}

message EpochResponse {}

// Renouvellement en deux phases, piloté par le coordinateur.
// Réservé au coordinateur : l'appelant présente le certificat "coordinator".
// Aucune part ni sous-part ne passe par ces messages.
service Epoch {
  // Phase 1 : échange les sous-parts avec les autres participants, puis calcule et garde
  // EN ATTENTE les parts de l'époque. Les parts en service restent inchangées.
  rpc Prepare(PrepareRequest) returns (EpochResponse);
  // Phase 2 : les parts en attente deviennent les parts en service, les anciennes sont effacées.
  rpc Commit(EpochRequest) returns (EpochResponse);
  // Abandon : les parts en attente et les sous-parts de l'époque sont effacées.
  rpc Abort(EpochRequest) returns (EpochResponse);
}
