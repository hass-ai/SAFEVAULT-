// Contrats gRPC des nœuds de stockage : service Node (client → nœud)
// et service Renewal (nœud → nœud, renouvellement des parts).
syntax = "proto3";

package safevault;

option go_package = "safevault/proto;pb";

// Preuve d'identité jointe à chaque requête adressée à un nœud.
// La signature Ed25519 porte sur : étiquette || 0x00 || "x|file_id|epoch|timestamp|nonce_hex".
message Proof {
  bytes public_key = 1;
  int64 timestamp = 2; // secondes Unix
  bytes nonce = 3;
  bytes signature = 4;
}

// Part de la clé d'un fichier, détenue par le nœud d'abscisse x.
message Share {
  uint32 x = 1;
  bytes value = 2;
  uint64 epoch = 3;
}

// Bloc chiffré d'un fichier.
message Block {
  string file_id = 1;
  uint32 index = 2;
  bytes data = 3;
  Proof proof = 4;
}

message PutShareRequest {
  string file_id = 1;
  Share share = 2;
  Proof proof = 3;
}

message PutShareResponse {}

// Autorisation de lecture d'un fichier, signée par son propriétaire (Ed25519).
// Les nœuds la vérifient avec la clé du propriétaire qu'ils ont enregistrée au dépôt :
// le coordinateur la transmet mais ne peut pas la fabriquer.
// Données signées : voir internal/access.
message Grant {
  string file_id = 1;
  bytes owner_public_key = 2;
  bytes grantee_public_key = 3;
  int64 issued_at = 4;  // secondes Unix
  int64 expires_at = 5; // secondes Unix
  bytes signature = 6;
}

// Retrait d'un accès, signé par le propriétaire : les autorisations émises avant
// revoked_at pour ce destinataire ne sont plus acceptées.
message Revocation {
  string file_id = 1;
  bytes owner_public_key = 2;
  bytes grantee_public_key = 3;
  int64 revoked_at = 4; // secondes Unix
  bytes signature = 5;
}

message GetShareRequest {
  string file_id = 1;
  uint64 epoch = 2; // époque attendue par le client
  Proof proof = 3;
  Grant grant = 4;  // absent pour le propriétaire
}

message GetShareResponse {
  Share share = 1;
}

message PutBlocksResponse {
  uint32 stored = 1; // nombre de blocs stockés
}

message GetBlocksRequest {
  string file_id = 1;
  Proof proof = 2;
  Grant grant = 3;  // absent pour le propriétaire
}

message RevokeRequest {
  Revocation revocation = 1;
}

message RevokeResponse {}

service Node {
  // Dépose la part de la clé du fichier sur le nœud.
  rpc PutShare(PutShareRequest) returns (PutShareResponse);
  // Renvoie la part du nœud ; FAILED_PRECONDITION si l'époque ne correspond pas.
  rpc GetShare(GetShareRequest) returns (GetShareResponse);
  // Reçoit les blocs chiffrés d'un fichier en flux.
  rpc PutBlocks(stream Block) returns (PutBlocksResponse);
  // Renvoie les blocs chiffrés d'un fichier en flux.
  rpc GetBlocks(GetBlocksRequest) returns (stream Block);
  // Enregistre le retrait d'un accès, signé par le propriétaire du fichier.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
}

// Sous-part d'un fichier envoyée pendant un renouvellement.
message SubShare {
  string file_id = 1;
  bytes value = 2;
}

message DeliverSubSharesRequest {
  uint32 from_x = 1;       // abscisse du nœud émetteur
  uint32 to_x = 2;         // abscisse du nœud destinataire
  uint64 target_epoch = 3; // époque visée par le renouvellement
  repeated SubShare sub_shares = 4;
}

message DeliverSubSharesResponse {}

service Renewal {
  // Reçoit les sous-parts d'un autre nœud pour l'époque cible.
  // Réservé aux nœuds : l'appelant présente le certificat "node-<from_x>".
  rpc DeliverSubShares(DeliverSubSharesRequest) returns (DeliverSubSharesResponse);
}

// Nœud participant à un renouvellement.
message Participant {
  uint32 x = 1;
  string address = 2; // "hôte:port"
}

message PrepareRequest {
  uint64 epoch = 1;                       // époque cible
  uint32 t = 2;                           // seuil
  repeated Participant participants = 3;  // ensemble fixé par le coordinateur, le même pour tous
}

message EpochRequest {
  uint64 epoch = 1;
}

message EpochResponse {}

// Renouvellement en deux phases, piloté par le coordinateur.
// Réservé au coordinateur : l'appelant présente le certificat "coordinator".
// Aucune part ni sous-part ne passe par ces messages.
service Epoch {
  // Phase 1 : échange les sous-parts avec les autres participants, puis calcule et garde
  // EN ATTENTE les parts de l'époque. Les parts en service restent inchangées.
  rpc Prepare(PrepareRequest) returns (EpochResponse);
  // Phase 2 : les parts en attente deviennent les parts en service, les anciennes sont effacées.
  rpc Commit(EpochRequest) returns (EpochResponse);
  // Abandon : les parts en attente et les sous-parts de l'époque sont effacées.
  rpc Abort(EpochRequest) returns (EpochResponse);
}
