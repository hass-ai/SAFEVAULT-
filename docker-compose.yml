# Déploiement local de SafeVault : le coordinateur et 5 nœuds de stockage.
#
#   scripts/gen_certs.sh                             # une seule fois
#   docker compose up --build
#   docker compose stop node-3                       # simule la panne d'un nœud
#   docker compose kill -s SIGUSR1 coordinator       # lance un renouvellement des parts
#
# Ports publiés sur la machine : coordinateur 7443, nœuds 7451 à 7455.

x-node: &node
  build:
    context: .
    args:
      CMD: node
  restart: unless-stopped
  environment: &node-env
    LISTEN_ADDR: ":7444"
    DATA_DIR: /data
    TLS_CERT_PATH: /certs/node.crt
    TLS_KEY_PATH: /certs/node.key
    CA_PATH: /certs/ca.crt

services:
  node-1:
    <<: *node
    environment: { <<: *node-env, NODE_X: "1" }
    ports: ["7451:7444"]
    volumes:
      - node-1-data:/data
      - ./certs/node-1.crt:/certs/node.crt:ro
      - ./certs/node-1.key:/certs/node.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  node-2:
    <<: *node
    environment: { <<: *node-env, NODE_X: "2" }
    ports: ["7452:7444"]
    volumes:
      - node-2-data:/data
      - ./certs/node-2.crt:/certs/node.crt:ro
      - ./certs/node-2.key:/certs/node.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  node-3:
    <<: *node
    environment: { <<: *node-env, NODE_X: "3" }
    ports: ["7453:7444"]
    volumes:
      - node-3-data:/data
      - ./certs/node-3.crt:/certs/node.crt:ro
      - ./certs/node-3.key:/certs/node.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  node-4:
    <<: *node
    environment: { <<: *node-env, NODE_X: "4" }
    ports: ["7454:7444"]
    volumes:
      - node-4-data:/data
      - ./certs/node-4.crt:/certs/node.crt:ro
      - ./certs/node-4.key:/certs/node.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  node-5:
    <<: *node
    environment: { <<: *node-env, NODE_X: "5" }
    ports: ["7455:7444"]
    volumes:
      - node-5-data:/data
      - ./certs/node-5.crt:/certs/node.crt:ro
      - ./certs/node-5.key:/certs/node.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro

  coordinator:
    build:
      context: .
      args:
        CMD: coordinator
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":7443"
      DATA_DIR: /data
      TLS_CERT_PATH: /certs/coordinator.crt
      TLS_KEY_PATH: /certs/coordinator.key
      CA_PATH: /certs/ca.crt
      SV_N: "5"
      SV_T: "3"
      RENEWAL_INTERVAL: "10m"
    ports: ["7443:7443"]
    volumes:
      - coordinator-data:/data
      - ./certs/coordinator.crt:/certs/coordinator.crt:ro
      - ./certs/coordinator.key:/certs/coordinator.key:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on: [node-1, node-2, node-3, node-4, node-5]

volumes:
  coordinator-data:
  node-1-data:
  node-2-data:
  node-3-data:
  node-4-data:
  node-5-data:
